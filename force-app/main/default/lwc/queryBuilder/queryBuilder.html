<template>
    <lightning-card title="Dynamic SOQL Query Builder"
                    icon-name="standard:search">

        <div class="slds-p-around_medium">

            <lightning-combobox
                label="Select Object"
                value={selectedObject}
                options={objectOptions}
                onchange={handleObjectChange}>
            </lightning-combobox>

            <lightning-dual-listbox
                name="fields"
                label="Select Fields"
                source-label="Available Fields"
                selected-label="Selected Fields"
                options={fieldOptions}
                value={selectedFields}
                onchange={handleFieldsChange}
                class="slds-m-top_medium">
            </lightning-dual-listbox>

            <lightning-combobox
                label="Maximum Records"
                value={recordLimit}
                options={limitOptions}
                onchange={handleLimitChange}
                class="slds-m-top_medium">
            </lightning-combobox>

            <lightning-textarea
                label="Generated SOQL Query (Editable)"
                value={soql}
                onchange={handleQueryChange}
                class="slds-m-top_medium">
            </lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Execute Query"
                    variant="brand"
                    onclick={handleExecute}
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <template lwc:if={errorMessage}>
                <div class="slds-box slds-theme_error slds-m-top_medium">
                    <lightning-icon
                        icon-name="utility:error"
                        variant="inverse"
                        size="small">
                    </lightning-icon>
                    <span class="slds-m-left_small">
                        {errorMessage}
                    </span>
                </div>
            </template>

            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="Executing query"
                    size="medium">
                </lightning-spinner>
            </template>

            <template lwc:if={hasResults}>
                <div class="slds-m-top_large">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">
                        Query Results ({resultCount})
                    </h2>

                    <lightning-datatable
                        key-field="Id"
                        data={records}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
